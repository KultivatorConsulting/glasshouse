# Glasshouse configuration — matches DESIGN.md §8 schema.
#
# Secrets referenced via `secret://<name>` resolve to env vars:
#     secret://pikvm-1-passwd  ->  GLASSHOUSE_SECRET_PIKVM_1_PASSWD
# (uppercase, non-alphanumerics replaced with `_`).

target:
  logical_desktop:
    width: 3840           # N=2, two 1920x1080 side by side
    height: 1080

  monitors:
    - id: 1
      origin: [0, 0]
      size: [1920, 1080]
      pikvm: 192.168.1.71
    - id: 2
      origin: [1920, 0]
      size: [1920, 1080]
      pikvm: 192.168.1.72

# Exactly one entry in target.monitors must match hid_master.
hid_master: 192.168.1.71

auth:
  192.168.1.71:
    user: admin
    password_ref: secret://pikvm-1-passwd
    # totp_secret_ref: secret://pikvm-1-totp   # optional, base32 TOTP seed
    insecure_tls: true                          # PiKVMs ship self-signed certs
  192.168.1.72:
    user: admin
    password_ref: secret://pikvm-2-passwd
    insecure_tls: true

# Hotkeys. Empty / missing values fall back to the defaults shown.
release_hotkey:      "Ctrl+Alt+Shift+Backspace"
fullscreen_hotkey:   "F11"
special_keys_hotkey: "Ctrl+Alt+K"
# Types the host clipboard onto the target as keystrokes, via the HID
# master's server-side keymap. Text-only; press again mid-paste to abort.
paste_hotkey:        "Ctrl+Alt+Shift+V"
# Drag out a region of the window under the cursor, extract its text via
# Tui, and put the result on the host clipboard. Needs ocr.api_key below.
region_hotkey:       "Ctrl+Alt+Shift+C"

# Region-capture text extraction (see region_hotkey).
#
# provider picks what does the work. Left unset it resolves to `tui`
# when api_key is set (what a config written before providers existed
# meant) and `pikvm` otherwise.
#
#   pikvm    The PiKVM's own Tesseract. Nothing to install anywhere, and
#            the image never leaves the LAN. Stock firmware ships it
#            enabled — check with GET /api/streamer/ocr. Keep selections
#            small: a 300x100 region takes ~2 s on a PiKVM 3, 890x320
#            takes ~11 s, and a full 1920x1080 frame times out at 60 s.
#   command  Any host program: PNG on stdin, text on stdout. Install
#            tesseract-ocr (~8 MB on noble) and point `command` at it.
#   openai   Any OpenAI-compatible /v1/chat/completions, authenticated
#            with `Authorization: Bearer`. Reads screens far better than
#            Tesseract. Also how you reach a local Ollama / vLLM /
#            LM Studio — set `endpoint` and the key it expects.
#   tui      Kultivator's endpoint, authenticated with `X-API-Key`.
#   none     Off. The region hotkey still selects, and reports that
#            nothing is configured.
#
# The model-backed providers send the selected image to a third party.
# `pikvm` and `command` do not.
ocr:
  provider: pikvm

  # provider: pikvm — languages to ask for. The PiKVM lists what it has
  # at /api/streamer/ocr; stock firmware has eng and osd.
  langs: ["eng"]

  # provider: command — argv, run with the PNG on stdin.
  # command: ["tesseract", "-", "-"]

  # provider: openai | tui
  # api_key: "secret://tui-api-key"  # resolved via secrets.yaml or
  #                                  # GLASSHOUSE_SECRET_TUI_API_KEY
  # endpoint: "..."                  # defaults per provider
  # model: "auto"
  # reasoning_effort: "none"         # transcription needs no reasoning
  # max_tokens: 8000                 # below this the model can return
  #                                  # 200 with empty content
  # prompt: "..."                    # default asks for verbatim text

  # All providers. Generous on purpose — PiKVM-side OCR is not fast.
  timeout_ms: 60000

# Local MCP server (DESIGN.md §10.11). Exposes the running session to any
# MCP client: screen indexes, the combined desktop, screenshots, typing,
# key chords and pointer control.
#
# Off by default on purpose. This is a remote-control surface for the
# target machine — anything that can reach the port can type on it and
# click it — so turn it on deliberately and leave `bind` on loopback
# unless you have a reason not to. Setting `token` requires callers to
# send `Authorization: Bearer <value>`; it is a `secret://` reference
# resolved exactly like a PiKVM password, and if it cannot be resolved the
# server does not start rather than listening unauthenticated.
#
# Once running:
#   claude mcp add --transport http glasshouse http://127.0.0.1:8765/mcp
#
# `glasshouse-mcpprobe` serves a synthetic two-head session on 18766 if
# you want to look at the tool surface without any PiKVMs attached.
mcp:
  enabled: false
  bind: "127.0.0.1"
  port: 8765
  # token: "secret://mcp_token"

windows:
  - target_monitor: 1
    geometry: { x: 0,   y: 0, w: 960, h: 540 }
  - target_monitor: 2
    geometry: { x: 960, y: 0, w: 960, h: 540 }
