# glasshouse-viewer example config.
#
# Copy this file to ~/.config/glasshouse/config.yaml (or pass --config) and
# fill in your PiKVM hosts and credentials. See specs/DESIGN.md §8 for the
# full schema.

target:
  # Total combined logical desktop size on the *target* machine (the
  # combined extents of every HDMI output that's running through one of
  # your PiKVMs). PiKVM API coords are mapped against this.
  logical_desktop:
    width: 3840
    height: 1080

  # One entry per target monitor. `pikvm` is the IP/hostname of the
  # PiKVM whose HDMI input is wired to that target monitor.
  monitors:
    - id: 1
      origin: [0, 0]
      size: [1920, 1080]
      pikvm: 192.168.1.71
    - id: 2
      origin: [1920, 0]
      size: [1920, 1080]
      pikvm: 192.168.1.144

# Which PiKVM is plugged into the target's USB HID — input from every
# window routes here.
hid_master: 192.168.1.71

# Per-host auth and video transport. transport=mjpeg for older PiKVM
# images that don't ship Janus; transport=janus (default) for PiKVM 4.
auth:
  192.168.1.71:
    user: admin
    password_ref: secret://pikvm-71-passwd
    insecure_tls: true
    # transport: janus    # default
  192.168.1.144:
    user: admin
    password_ref: secret://pikvm-144-passwd
    insecure_tls: true
    transport: mjpeg

# Hotkeys. Empty / missing values fall back to the defaults shown.
release_hotkey:      "Ctrl+Alt+Shift+Backspace"
fullscreen_hotkey:   "F11"
special_keys_hotkey: "Ctrl+Alt+K"
# Types the host clipboard onto the target as keystrokes, via the HID
# master's server-side keymap. Text-only; press again mid-paste to abort.
paste_hotkey:        "Ctrl+Alt+Shift+V"
# Drag out a region of the window under the cursor, extract its text via
# Tui, and put the result on the host clipboard. Needs ocr.api_key below.
region_hotkey:       "Ctrl+Alt+Shift+C"

# Region-capture text extraction (see region_hotkey). Everything except
# api_key is optional; the defaults shown are what the viewer uses.
ocr:
  api_key: "secret://tui-api-key"   # resolved via secrets.yaml or
                                    # GLASSHOUSE_SECRET_TUI_API_KEY
  # endpoint: "https://chat.kultivator.net.nz/v1/chat/completions"
  # model: "auto"
  # reasoning_effort: "none"        # transcription needs no reasoning
  # max_tokens: 8000                # below this the model can return
                                    # 200 with empty content
  # timeout_ms: 60000
  # prompt: "..."                  # default asks for verbatim text

# Optional. Each entry produces a button in the Special Keys palette's
# Custom tab (and is the source of truth for the future macro-pad daemon).
shortcuts:
  - label: "Open terminal"
    keys: [ControlLeft, AltLeft, KeyT]
  - label: "Lock session"
    keys: [MetaLeft, KeyL]

video:
  prefer_hw_decode: true
  # NOTE: target_fps is currently NOT enforced on the MJPEG path. The
  # client-side videorate cap was a no-op on ustreamer's untimestamped stream
  # (it only added latency) and was removed; frames are governed by the leaky
  # queue instead. Kept for forward-compat; has no effect today.
  target_fps: 30
  # Janus/H.264 jitterbuffer dwell (ms). webrtcbin's default is 200, tuned
  # for lossy internet; on the LAN a PiKVM lives on that's pure added lag.
  # Lower = less video latency, less tolerance for jitter/loss. 50–100 suits
  # a wired LAN; raise toward 200 on flaky Wi-Fi. (Janus transport only.)
  webrtc_latency_ms: 100
  # Capture cursor marker: a zero-lag local pointer drawn while captured that
  # the (laggy) guest cursor converges to. style: ring | crosshair | hidden.
  cursor_marker: ring
  cursor_marker_color: "#FFA000"
  cursor_marker_size: 24

# Local MCP server (DESIGN.md §10.11). Exposes the running session to any
# MCP client: screen indexes, the combined desktop, screenshots, typing,
# key chords and pointer control.
#
# Off by default on purpose. This is a remote-control surface for the
# target machine — anything that can reach the port can type on it and
# click it — so turn it on deliberately and leave `bind` on loopback
# unless you have a reason not to. Setting `token` requires callers to
# send `Authorization: Bearer <value>`; it is a `secret://` reference
# resolved exactly like a PiKVM password, and if it cannot be resolved the
# server does not start rather than listening unauthenticated.
#
# Once running:
#   claude mcp add --transport http glasshouse http://127.0.0.1:8765/mcp
#
# `glasshouse-mcpprobe` serves a synthetic two-head session on 18766 if
# you want to look at the tool surface without any PiKVMs attached.
mcp:
  enabled: false
  bind: "127.0.0.1"
  port: 8765
  # token: "secret://mcp_token"

# One window per target monitor. `geometry` is optional — leave it out
# and the window remembers its last position via QSettings (per-host).
windows:
  - target_monitor: 1
    geometry: { x: 0,    y: 0, w: 1280, h: 720 }
  - target_monitor: 2
    geometry: { x: 1280, y: 0, w: 1280, h: 720 }
